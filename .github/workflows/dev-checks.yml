name: Python reference checks
on:
  push:
    branches: ['3.5', dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
env:
  LOFI_TEST_BACKEND: python
  LOFI_BACKEND: python
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv dbus python3-gi python3-venv openssl
      - name: Backend and process isolation tests
        run: |
          PYTHONPATH=tests dbus-run-session --config-file tests/dbus-no-activation.conf -- /usr/bin/python3 -B -m unittest -v fade_test feed_test media_test mpris_test player_test process_test recovery_test youtube_test config_test tls_test
      - name: Security analysis
        run: |
          /usr/bin/python3 -m venv /tmp/lofi-bandit
          /tmp/lofi-bandit/bin/pip install bandit==1.9.4
          /tmp/lofi-bandit/bin/bandit -ll -f json -o /tmp/bandit.json lofi_backend.py lofi_config.py lofi_youtube.py lofi_duck.py lofi_feed.py lofi_media.py lofi-mpris lofi-feed lofi-ipc
          /usr/bin/python3 -c 'import json; r=json.load(open("/tmp/bandit.json")); assert not r["errors"], r["errors"]'
