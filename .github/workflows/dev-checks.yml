name: Dev checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv dbus python3-gi python3-venv
      - name: Backend and process isolation tests
        run: |
          PYTHONPATH=tests dbus-run-session -- /usr/bin/python3 -B -m unittest -v fade_test feed_test media_test mpris_test player_test process_test recovery_test
      - name: Security analysis
        run: |
          /usr/bin/python3 -m venv /tmp/lofi-bandit
          /tmp/lofi-bandit/bin/pip install bandit==1.9.4
          /tmp/lofi-bandit/bin/bandit -ll -f json -o /tmp/bandit.json lofi_backend.py lofi_duck.py lofi_feed.py lofi_media.py lofi-player lofi-mpris lofi-feed lofi-ipc
          /usr/bin/python3 -c 'import json; r=json.load(open("/tmp/bandit.json")); assert not r["errors"], r["errors"]'
